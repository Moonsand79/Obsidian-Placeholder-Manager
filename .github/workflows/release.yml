name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify tag matches manifest version
        run: node scripts/verify-tag.cjs "${GITHUB_REF_NAME}"

      - name: Run release gates
        run: npm run release:check

      - name: Stage exact release payload
        run: npm run release:stage

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/placeholder-manager/main.js dist/placeholder-manager/manifest.json dist/placeholder-manager/styles.css --title "${GITHUB_REF_NAME}" --generate-notes
